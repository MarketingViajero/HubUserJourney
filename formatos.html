  .hero-inner {
    display: flex;
    align-items: center;
    gap: 3rem;
  }
  .hero-left { flex: 1; min-width: 0; }
  .hero-right { flex: 1; min-width: 0; }
  .hero-gif {
    width: 100%;
    height: 260px;
    object-fit: cover;
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
  }
  @media (max-width: 700px) {
    .hero-inner { flex-direction: column; }
    .hero-gif { height: 180px; }
  }
  /* TIMELINE */
  .tl-tabs {
    display: flex; gap: 6px; margin-bottom: 1.2rem; flex-wrap: wrap;
  }
  .tl-tab {
    background: var(--vj-cream); border: 1px solid var(--vj-sand);
    color: var(--vj-tan); font-family: 'Geomanist', sans-serif;
    font-size: 11px; font-weight: 600; letter-spacing: 0.05em;
    padding: 6px 14px; border-radius: 20px; cursor: pointer;
    transition: all 0.2s;
  }
  .tl-tab.active, .tl-tab:hover {
    background: var(--vj-charcoal); color: white; border-color: var(--vj-charcoal);
  }
  .tl-fase { display: none; }
  .tl-fase.active { display: block; }
  .tl-desc {
    font-size: 0.82rem; color: var(--vj-tan); margin-bottom: 1rem;
    font-style: italic; line-height: 1.5;
  }
  .tl-steps { display: flex; flex-direction: column; gap: 0.7rem; }
  .tl-step {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 10px 12px; background: white;
    border: 1px solid var(--vj-sand); border-radius: 10px;
    transition: all 0.2s;
  }
  .tl-step:hover { border-color: var(--vj-orange); background: #FFF8F5; }
  .tl-dot {
    width: 26px; height: 26px; border-radius: 50%;
    color: white; font-size: 10px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px;
  }
  .tl-step-text { font-size: 0.82rem; color: #6B5E52; line-height: 1.5; }
  .tl-step-text strong { color: var(--vj-charcoal); font-weight: 600; }

  /* PERFILES */
  .perfil-panel { display: none; }
  .perfil-panel.active { display: block; }
  .perfil-card {
    background: white; border: 1px solid var(--vj-sand);
    border-radius: 12px; padding: 1.4rem;
    display: flex; flex-direction: column; gap: 1rem;
  }
  .perfil-nombre {
    font-size: 1.3rem; font-weight: 600;
    color: var(--vj-charcoal); letter-spacing: -0.01em;
  }
  .perfil-meta {
    font-size: 0.78rem; color: var(--vj-tan);
    font-weight: 500; margin-top: 2px;
  }
  .perfil-resumen {
    font-size: 0.83rem; color: #6B5E52;
    line-height: 1.6; margin-top: 8px;
    padding: 10px 14px; background: var(--vj-cream);
    border-radius: 8px;
  }
  .perfil-cols {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem;
  }
  @media (max-width: 560px) { .perfil-cols { grid-template-columns: 1fr; } }
  .perfil-col-title {
    font-size: 10px; font-weight: 700; letter-spacing: 0.15em;
    text-transform: uppercase; margin-bottom: 8px;
  }
  .perfil-col ul {
    list-style: none; padding: 0;
    display: flex; flex-direction: column; gap: 5px;
  }
  .perfil-col ul li {
    font-size: 0.78rem; color: #6B5E52; line-height: 1.4;
    padding-left: 10px; position: relative;
  }
  .perfil-col ul li::before {
    content: "·"; position: absolute; left: 0;
    color: var(--vj-tan);
  }


:root {
  --vj-cream: #F5F0E8;
  --vj-warm-white: #FBF8F3;
  --vj-sand: #E8DDD0;
  --vj-tan: #C9B99F;
  --vj-orange: #E8390E;
  --vj-gold: #E8722A;
  --vj-charcoal: #2D2926;
  --vj-brown: #B84E15;
  --vj-green: #3D7A5C;
  --vj-blue: #2E6FA3;
  --vj-purple: #5C4AB8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Geomanist', sans-serif; background: var(--vj-warm-white); color: var(--vj-charcoal); min-height: 100vh; }

/* HEADER */
.header {
  background: var(--vj-charcoal); padding: 1.2rem 2.5rem;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 3px solid var(--vj-orange);
  position: sticky; top: 0; z-index: 50;
}
.header-brand { display: flex; align-items: center; gap: 14px; }
.header-logo { height: 34px; width: auto; mix-blend-mode: screen; }
.header-title { font-size: 11px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: white; }
.header-count { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.3); color: white; font-size: 11px; font-weight: 600; padding: 5px 14px; border-radius: 20px; }

/* CONTROLS */
.controls { background: white; border-bottom: 1px solid var(--vj-sand); padding: 1rem 2.5rem; display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap; }
.search-box { display: flex; align-items: center; gap: 8px; background: var(--vj-cream); border: 1px solid var(--vj-sand); border-radius: 8px; padding: 7px 14px; min-width: 220px; }
.search-box input { border: none; background: transparent; font-family: 'Geomanist', sans-serif; font-size: 12px; color: var(--vj-charcoal); outline: none; width: 100%; }
.search-box input::placeholder { color: var(--vj-tan); }
.filter-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: 1; }
.filter-label { font-size: 10px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--vj-tan); flex-shrink: 0; }
.chip { background: var(--vj-cream); border: 1px solid var(--vj-sand); color: var(--vj-tan); font-family: 'Geomanist', sans-serif; font-size: 11px; font-weight: 600; padding: 5px 12px; border-radius: 20px; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
.chip:hover { background: var(--vj-sand); color: var(--vj-charcoal); }
.chip.active { background: var(--vj-charcoal); color: white; border-color: var(--vj-charcoal); }
.chip-priority { border-color: var(--vj-orange); color: var(--vj-orange); }
.chip-priority:hover, .chip-priority.active { background: var(--vj-orange); color: white; border-color: var(--vj-orange); }

/* RESULTS BAR */
.results-bar { padding: 0.8rem 2.5rem; font-size: 11px; color: var(--vj-tan); font-weight: 600; letter-spacing: 0.05em; }
.results-bar span { color: var(--vj-charcoal); }

/* INICIATIVA GROUP */
.ini-group { padding: 0 2.5rem 2.5rem; }
.ini-header { display: flex; align-items: center; gap: 12px; padding: 1.5rem 0 1rem; border-bottom: 1px solid var(--vj-sand); margin-bottom: 1.25rem; }
.ini-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.ini-name { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--vj-charcoal); }
.ini-count { background: var(--vj-cream); border: 1px solid var(--vj-sand); color: var(--vj-tan); font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; }

/* GALLERY */
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.piece-card { background: white; border: 1.5px solid var(--vj-sand); border-radius: 12px; overflow: hidden; cursor: pointer; transition: all 0.2s; }
.piece-card:hover { border-color: var(--vj-orange); transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.09); }
.piece-img-wrap { width: 100%; height: 120px; background: var(--vj-cream); position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.piece-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
.piece-placeholder { display: flex; flex-direction: column; align-items: center; gap: 5px; color: var(--vj-tan); opacity: 0.5; }
.piece-placeholder svg { width: 28px; height: 28px; }
.piece-placeholder span { font-size: 9px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
.piece-has-img { position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; background: var(--vj-green); border-radius: 50%; box-shadow: 0 0 0 2px white; }
.piece-fmt-badge { position: absolute; bottom: 7px; left: 7px; background: rgba(45,41,38,0.65); color: white; font-size: 9px; font-weight: 600; padding: 2px 7px; border-radius: 10px; letter-spacing: 0.05em; max-width: 80%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.piece-info { padding: 10px 12px 12px; }
.piece-area-row { display: flex; align-items: center; gap: 5px; margin-bottom: 5px; }
.piece-area-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.piece-area-label { font-size: 9px; color: var(--vj-tan); font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; }
.piece-name { font-size: 12px; font-weight: 600; line-height: 1.4; color: var(--vj-charcoal); }

/* MODAL */
.overlay { display: none; position: fixed; inset: 0; background: rgba(45,41,38,0.75); z-index: 200; align-items: center; justify-content: center; padding: 1.5rem; backdrop-filter: blur(6px); }
.overlay.active { display: flex; }
.modal { background: white; border-radius: 20px; max-width: 1000px; width: 100%; max-height: 92vh; overflow-y: auto; animation: slideUp 0.3s ease; box-shadow: 0 32px 80px rgba(0,0,0,0.2); }
@keyframes slideUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }

.modal-header { padding: 1.4rem 1.75rem 1.2rem; border-bottom: 1px solid var(--vj-sand); display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; position: sticky; top: 0; background: white; z-index: 2; border-radius: 20px 20px 0 0; }
.modal-area-tag { font-size: 10px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; padding: 4px 12px; border-radius: 20px; margin-bottom: 8px; display: inline-block; color: white; }
.modal-title { font-size: 1.4rem; font-weight: 700; color: var(--vj-charcoal); line-height: 1.3; }
.modal-ini { font-size: 13px; color: var(--vj-tan); font-weight: 500; margin-top: 4px; }
.modal-close { background: var(--vj-cream); border: 1px solid var(--vj-sand); color: var(--vj-tan); width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; font-family: sans-serif; }
.modal-close:hover { background: var(--vj-charcoal); color: white; border-color: var(--vj-charcoal); }
.modal-body { padding: 1.75rem; display: flex; flex-direction: column; gap: 1.25rem; }

/* IMG COMPARE */
.img-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
@media (max-width: 560px) { .img-compare { grid-template-columns: 1fr; } }
.img-col { display: flex; flex-direction: column; gap: 8px; }
.img-col-label { font-size: 10px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--vj-tan); }
.img-upload-zone { width: 100%; aspect-ratio: 4/3; border: 2px dashed var(--vj-sand); border-radius: 12px; background: var(--vj-cream); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s; position: relative; overflow: hidden; }
.img-upload-zone:hover { border-color: var(--vj-orange); background: #FFF8F5; }
.img-upload-zone.has-image { border-style: solid; border-color: var(--vj-sand); padding: 0; }
.img-upload-zone img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: white; }
.img-upload-zone input { display: none; }
.upload-hint { font-size: 11px; color: var(--vj-tan); font-weight: 500; text-align: center; line-height: 1.4; }
.upload-icon { font-size: 26px; opacity: 0.35; }
.img-change-btn { position: absolute; bottom: 8px; right: 8px; background: rgba(45,41,38,0.7); color: white; font-size: 10px; font-weight: 600; padding: 4px 10px; border-radius: 20px; cursor: pointer; border: none; font-family: 'Geomanist', sans-serif; z-index: 3; }

/* META FIELDS */
.meta-section { display: flex; flex-direction: column; gap: 10px; }
.meta-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 560px) { .meta-row { grid-template-columns: 1fr; } }
.meta-field { display: flex; flex-direction: column; gap: 5px; }
.meta-field label { font-size: 11px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--vj-tan); }
.meta-field input, .meta-field textarea {
  font-family: 'Geomanist', sans-serif; font-size: 13px;
  color: var(--vj-charcoal); background: var(--vj-cream);
  border: 1px solid var(--vj-sand); border-radius: 8px;
  padding: 8px 12px; outline: none; transition: border-color 0.2s;
  width: 100%;
}
.meta-field input:focus, .meta-field textarea:focus { border-color: var(--vj-orange); background: white; }
.meta-field textarea { resize: vertical; min-height: 60px; }

/* FORMATO CHIPS */
.fmt-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.fmt-chip {
  background: var(--vj-cream); border: 1.5px solid var(--vj-sand);
  color: var(--vj-tan); font-family: 'Geomanist', sans-serif;
  font-size: 11px; font-weight: 600; padding: 5px 12px;
  border-radius: 20px; cursor: pointer; transition: all 0.2s;
}
.fmt-chip:hover { border-color: var(--vj-orange); color: var(--vj-orange); }
.fmt-chip.selected { background: var(--vj-orange); color: white; border-color: var(--vj-orange); }

/* TOAST */
#vj-toast { position: fixed; bottom: 24px; right: 24px; background: var(--vj-charcoal); color: white; padding: 10px 18px; border-radius: 8px; font-size: 12px; font-weight: 600; z-index: 9999; transition: opacity 0.4s; opacity: 0; font-family: 'Geomanist', sans-serif; box-shadow: 0 4px 16px rgba(0,0,0,0.25); }
#vj-toast.show { opacity: 1; }

.empty-state { text-align: center; padding: 4rem 2rem; color: var(--vj-tan); }
.empty-state p { font-size: 0.9rem; margin-top: 0.5rem; }

/* PRIORITY BADGE */
.piece-priority-badge {
  position: absolute; top: 7px; left: 7px;
  background: var(--vj-orange); color: white;
  font-size: 9px; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; padding: 3px 8px;
  border-radius: 20px; z-index: 2;
  display: flex; align-items: center; gap: 4px;
}
.piece-card.is-priority {
  border: 2px solid var(--vj-orange);
  box-shadow: 0 0 0 1px rgba(232,57,14,0.15);
}
.piece-card.is-priority:hover {
  border-color: var(--vj-orange);
  box-shadow: 0 8px 24px rgba(232,57,14,0.18);
}
.piece-priority-label {
  font-size: 10px; font-weight: 700;
  color: var(--vj-orange); letter-spacing: 0.08em;
  text-transform: uppercase; margin-top: 4px;
  display: flex; align-items: center; gap: 3px;
}

/* LIGHTBOX */
.lightbox {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.92); z-index: 500;
  align-items: center; justify-content: center;
  padding: 2rem; cursor: zoom-out;
  animation: fadeIn 0.2s ease;
}
.lightbox.active { display: flex; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.lightbox img {
  max-width: 90vw; max-height: 85vh;
  object-fit: contain; border-radius: 8px;
  box-shadow: 0 24px 80px rgba(0,0,0,0.5);
  cursor: default;
}
.lightbox-close {
  position: absolute; top: 1.5rem; right: 1.5rem;
  background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
  color: white; width: 38px; height: 38px; border-radius: 50%;
  cursor: pointer; font-size: 18px; display: flex;
  align-items: center; justify-content: center;
  font-family: sans-serif; transition: all 0.2s;
}
.lightbox-close:hover { background: rgba(255,255,255,0.2); }
.lightbox-caption {
  position: absolute; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.6); color: rgba(255,255,255,0.7);
  font-size: 11px; font-weight: 600; padding: 6px 16px;
  border-radius: 20px; white-space: nowrap;
}
.img-upload-zone.has-image:hover::after {
  content: '🔍 Ver imagen';
  position: absolute; inset: 0;
  background: rgba(0,0,0,0.35);
  display: flex; align-items: center; justify-content: center;
  color: white; font-size: 12px; font-weight: 700;
  letter-spacing: 0.05em; border-radius: 12px;
  pointer-events: none;
}
</style>

const STORAGE_KEY = 'vj_formatos_v2';

let activeArea = 'all';
let savedData = {};
let currentId = null;

// ── STORAGE ──
function loadLocal() { try { savedData = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) {} }
function saveLocal() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(savedData)); } catch(e) {} }
function getOrCreate(id) { if (!savedData[id]) savedData[id] = {}; return savedData[id]; }

// ── GAS ──
async function gasReq(payload) {
  if (!GAS_URL || GAS_URL.includes('TU_')) return null;
  try { const r = await fetch(GAS_URL, { method:'POST', body:JSON.stringify(payload), headers:{'Content-Type':'text/plain'} }); return await r.json(); }
  catch(e) { return null; }
}

async function initData() {
  loadLocal(); renderAll();
  const r = await gasReq({ action:'getAll' });
  if (r && r.ok && r.data) { savedData = Object.assign({}, savedData, r.data); saveLocal(); renderAll(); }
}

// ── TOAST ──
function toast(msg, color) {
  const el = document.getElementById('vj-toast');
  el.textContent = msg; el.style.background = color || '#2D2926';
  el.classList.add('show'); clearTimeout(window._tt);
  if (!msg.startsWith('⏳')) window._tt = setTimeout(() => el.classList.remove('show'), 2800);
}

// ── FILTER ──
function setIni(btn) {
  document.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeArea = 'all';
  window._activeIni = 'SEÑALÉTICA';
  renderAll();
}
function setArea(btn) {
  window._activeIni = null;
  document.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active'); activeArea = btn.dataset.area; renderAll();
}

function pieceId(d) { return (d.area + '_' + d.iniciativa + '_' + d.pieza).replace(/[^a-zA-Z0-9]/g,'_'); }

function getFiltered() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  return rawData.filter(d => {
    const id = pieceId(d);
    const iniFilter = window._activeIni;
    if (iniFilter) return d.iniciativa === iniFilter && (!q || d.pieza.toLowerCase().includes(q));
    const areaOk = activeArea === 'all' || (activeArea === 'priority' ? PRIORITY_IDS.has(id) : d.area === activeArea);
    const searchOk = !q || d.pieza.toLowerCase().includes(q) || d.iniciativa.toLowerCase().includes(q);
    return areaOk && searchOk;
  });
}

// ── RENDER ──
function renderAll() {
  const filtered = getFiltered();
  const container = document.getElementById('mainGrid');
  document.getElementById('resultsBar').innerHTML = `Mostrando <span>${filtered.length}</span> de ${rawData.length} piezas`;
  document.getElementById('headerCount').textContent = filtered.length + ' piezas';

  if (!filtered.length) {
    container.innerHTML = '<div class="empty-state"><div style="font-size:2rem">🔍</div><p>No se encontraron piezas.</p></div>';
    return;
  }

  const groups = {};
  filtered.forEach(d => { if (!groups[d.iniciativa]) groups[d.iniciativa] = []; groups[d.iniciativa].push(d); });

  container.innerHTML = Object.entries(groups).map(([ini, pieces]) => {
    const color = AREA_COLORS[pieces[0].area] || '#888780';
    const cards = pieces.map(d => {
      const id = pieceId(d);
      const s = savedData[id] || {};
      const previewSrc = s.imgAntes || s.img2026 || '';
      const fmts = s.formatos ? JSON.parse(s.formatos) : [];
      const fmtBadge = fmts.length ? `<div class="piece-fmt-badge">${fmts[0]}${fmts.length > 1 ? ' +' + (fmts.length-1) : ''}</div>` : '';
      const imgContent = previewSrc
        ? `<img src="${previewSrc}" alt="">`
        : `<div class="piece-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg><span>Sin imagen</span></div>`;
      const isPriority = PRIORITY_IDS.has(id);
      return `<div class="piece-card${isPriority ? ' is-priority' : ''}" onclick="openModal('${id}')">
        <div class="piece-img-wrap">${imgContent}${previewSrc ? '<div class="piece-has-img"></div>' : ''}${fmtBadge}</div>
        <div class="piece-info">
          <div class="piece-area-row"><div class="piece-area-dot" style="background:${color};"></div><span class="piece-area-label">${d.area}</span></div>
          <div class="piece-name">${d.pieza}</div>
          ${isPriority ? '<div class="piece-priority-label">★ Prioritaria</div>' : ''}
        </div>
      </div>`;
    }).join('');
    return `<div class="ini-group">
      <div class="ini-header"><div class="ini-dot" style="background:${color};"></div><div class="ini-name">${ini}</div><div class="ini-count">${pieces.length}</div></div>
      <div class="gallery">${cards}</div>
    </div>`;
  }).join('');
}

// ── MODAL ──
function openModal(id) {
  currentId = id;
  const d = rawData.find(x => pieceId(x) === id);
  if (!d) return;
  const color = AREA_COLORS[d.area] || '#888780';
  document.getElementById('modalAreaTag').textContent = d.area;
  document.getElementById('modalAreaTag').style.background = color;
  document.getElementById('modalTitle').textContent = d.pieza;
  document.getElementById('modalIni').textContent = d.iniciativa;

  const s = savedData[id] || {};
  setZone('zoneAntes', s.imgAntes);
  setZone('zone2026', s.img2026);

  // Formato chips
  const selected = s.formatos ? JSON.parse(s.formatos) : [];
  document.getElementById('fmtChips').innerHTML = FORMATOS.map(f =>
    `<button class="fmt-chip${selected.includes(f) ? ' selected' : ''}" onclick="toggleFormato('${f}')">${f}</button>`
  ).join('');

  // Campos de texto
  document.getElementById('fieldDimensiones').value = s.dimensiones || '';
  document.getElementById('fieldNotas').value = s.notas || '';
  document.getElementById('fieldLink').value = s.linkArchivo || '';
  updateLinkBtn();

  document.getElementById('pieceOverlay').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('pieceOverlay').classList.remove('active');
  document.body.style.overflow = '';
}
function overlayClick(e) { if (e.target === document.getElementById('pieceOverlay')) closeModal(); }

function setZone(zoneId, src) {
  const zone = document.getElementById(zoneId);
  zone.querySelectorAll('img.pv, .img-change-btn').forEach(el => el.remove());
  const hint = zone.querySelector('.upload-hint');
  const icon = zone.querySelector('.upload-icon');
  if (src) {
    zone.classList.add('has-image');
    const img = document.createElement('img'); img.src = src; img.className = 'pv';
    img.style.cursor = 'zoom-in';
    const label = zoneId === 'zoneAntes' ? 'Pieza anterior' : 'Propuesta 2026';
    img.onclick = e => { e.stopPropagation(); openLightbox(src, label); };
    zone.appendChild(img);
    if (hint) hint.style.display = 'none'; if (icon) icon.style.display = 'none';
    const btn = document.createElement('button'); btn.className = 'img-change-btn'; btn.textContent = '✎ Cambiar';
    btn.onclick = e => { e.stopPropagation(); zone.querySelector('input').click(); }; zone.appendChild(btn);
  } else {
    zone.classList.remove('has-image');
    if (hint) hint.style.display = ''; if (icon) icon.style.display = '';
  }
}

// ── UPLOAD ──
function handleUpload(input, side) {
  const file = input.files[0]; if (!file || !currentId) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const max = 400; let w = img.width, h = img.height;
      if (w > max || h > max) { if (w > h) { h = Math.round(h*max/w); w = max; } else { w = Math.round(w*max/h); h = max; } }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const compressed = canvas.toDataURL('image/jpeg', 0.5);
      const field = side === 'antes' ? 'imgAntes' : 'img2026';
      const zoneId = side === 'antes' ? 'zoneAntes' : 'zone2026';
      getOrCreate(currentId)[field] = compressed; saveLocal();
      setZone(zoneId, compressed); renderAll(); toast('⏳ Guardando...');
      gasReq({ action:'saveField', cardId:currentId, field, value:compressed })
        .then(r => toast(r && r.ok ? '✓ Guardado en Sheets' : '✓ Guardado localmente', r && r.ok ? '#2A5E44' : '#B84E15'));
    }; img.src = e.target.result;
  }; reader.readAsDataURL(file);
}

// ── FORMATO ──
function toggleFormato(fmt) {
  if (!currentId) return;
  const s = getOrCreate(currentId);
  let fmts = s.formatos ? JSON.parse(s.formatos) : [];
  if (fmts.includes(fmt)) fmts = fmts.filter(f => f !== fmt); else fmts.push(fmt);
  s.formatos = JSON.stringify(fmts); saveLocal(); renderAll();
  document.querySelectorAll('.fmt-chip').forEach(btn => {
    btn.classList.toggle('selected', fmts.includes(btn.textContent));
  });
  gasReq({ action:'saveField', cardId:currentId, field:'formatos', value:s.formatos })
    .then(r => toast(r && r.ok ? '✓ Guardado' : '✓ Local', r && r.ok ? '#2A5E44' : '#B84E15'));
}

// ── META FIELDS ──
function updateLinkBtn() {
  const val = document.getElementById('fieldLink').value.trim();
  const btn = document.getElementById('linkOpenBtn');
  if (btn) {
    btn.style.display = val ? 'inline-flex' : 'none';
    btn.href = val;
  }
}
function openLink() {
  const val = document.getElementById('fieldLink').value.trim();
  if (val) window.open(val, '_blank');
  return false;
}
function saveMetaField(field, value) {
  if (!currentId) return;
  getOrCreate(currentId)[field] = value; saveLocal();
  clearTimeout(window['_mt_' + field]);
  window['_mt_' + field] = setTimeout(() => {
    gasReq({ action:'saveField', cardId:currentId, field, value })
      .then(r => toast(r && r.ok ? '✓ Guardado' : '✓ Local', r && r.ok ? '#2A5E44' : '#B84E15'));
  }, 800);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').classList.contains('active')) closeLightbox();
    else closeModal();
  }
});

// ── LIGHTBOX ──
function openLightbox(src, caption) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightboxCaption').textContent = caption || '';
  document.getElementById('lightbox').classList.add('active');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
}
initData();
</script>
